[package]
name = "vault-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WASM bindings for vault-core: browser/extension crypto boundary"

[lib]
crate-type = ["cdylib"]

[dependencies]
vault-core = { path = "../vault-core" }
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }
# The "js" feature routes getrandom to the browser's crypto.getRandomValues.
# It is additive, so enabling it here turns it on for vault-core too.
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["console"]
console = ["dep:console_error_panic_hook"]

# The wasm-opt bundled with this wasm-pack predates bulk-memory and rejects our
# output. Disable it for now; re-enable with a modern binaryen when we optimize.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
